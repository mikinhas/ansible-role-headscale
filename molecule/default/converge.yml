---
- name: Converge
  hosts: all
  gather_facts: true
  roles:
    - role: ansible-role-headscale
      headscale_domain: headscale.test.local
      headscale_users:
        - name: alice
          preauthkey: true
          expiration: 24h
        - name: bob
          preauthkey: true
      headscale_exit_node: true
